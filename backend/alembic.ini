# A generic, single database configuration for an async dialect.

[alembic]
# Chemin vers le dossier contenant env.py
script_location = migrations

# Format de nommage pour les fichiers de migration générés
file_template = %%(year)d_%%(month)02d_%%(day)02d_%%(hour)02d%%(minute)02d-%%(rev)s_%%(slug)s

# Précise que tu n'insères pas l'URL ici, car tu la gères dans env.py
# sqlalchemy.url = 

[post_write_hooks]
# Hooks optionnels pour formater le code (black, etc.)

# --- Configuration du Logging (Obligatoire pour qu'Alembic tourne) ---

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S